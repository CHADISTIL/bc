<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio to Video Converter</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #0b1220;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: #142035;
    border-radius: 18px;
    border: 1px solid #263751;
}

h2 {
    text-align: center;
    color: #00d9ff;
}

p {
    color: #c4d0e2;
    line-height: 1.8;
}

input {
    width: 100%;
    padding: 15px;
    background: #0b1424;
    color: white;
    border-radius: 10px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 15px;
    background: #00c8d9;
    color: #00131b;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

progress {
    width: 100%;
    height: 15px;
    margin-top: 20px;
}

#status {
    font-size: 14px;
    overflow-wrap: anywhere;
}

#download {
    display: none;
    padding: 15px;
    margin-top: 20px;
    background: #164c3a;
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>تحويل الصوت إلى فيديو MP4</h2>

<p>
اختر ملفك الصوتي وسيتم إنشاء فيديو حقيقي
بخلفية سوداء ثابتة وصوت أصلي، جاهز للرفع إلى YouTube.
</p>

<input type="file" id="audioFile" accept="audio/*">

<button id="convert" disabled>
إنشاء الفيديو
</button>

<progress id="progress" value="0" max="100"></progress>

<p id="status">اختر ملفاً صوتياً للبدء.</p>

<a id="download" download="audio-video.mp4">
تحميل الفيديو MP4
</a>

</div>

<script type="module">

import { FFmpeg } from
"https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import { toBlobURL } from
"https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

const fileInput = document.getElementById("audioFile");
const button = document.getElementById("convert");
const status = document.getElementById("status");
const progress = document.getElementById("progress");
const download = document.getElementById("download");

let selectedFile = null;
let outputURL = null;

fileInput.addEventListener("change", () => {

    selectedFile = fileInput.files[0];

    button.disabled = !selectedFile;

    download.style.display = "none";

    if (outputURL) {
        URL.revokeObjectURL(outputURL);
        outputURL = null;
    }

    if (selectedFile) {
        status.textContent =
        "تم اختيار: " + selectedFile.name;
    }

});

button.addEventListener("click", async () => {

    if (!selectedFile) return;

    button.disabled = true;
    fileInput.disabled = true;

    progress.value = 0;

    let ffmpeg;
    let workerBlobURL;
    let workerObjectURL;
    let coreURL;
    let wasmURL;

    try {

        status.textContent =
        "جاري تحميل محرك FFmpeg...";

        ffmpeg = new FFmpeg();

        ffmpeg.on("progress", ({ progress: value }) => {

            if (Number.isFinite(value)) {
                progress.value =
                Math.min(100, value * 100);
            }

        });

        const packageURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm";

        const coreBase =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";

        // تحميل Worker وتحويله إلى Blob محلي
        const workerResponse =
        await fetch(packageURL + "/worker.js");

        if (!workerResponse.ok) {
            throw new Error("تعذر تحميل Worker");
        }

        let workerCode = await workerResponse.text();

        workerCode = workerCode.replace(
            /from\s*(["'])\.\/([^"']+)\1/g,
            'from "' + packageURL + '/$2"'
        );

        workerBlobURL = URL.createObjectURL(
            new Blob([workerCode], {
                type: "text/javascript"
            })
        );

        // تحميل ملفات FFmpeg
        coreURL = await toBlobURL(
            coreBase + "/ffmpeg-core.js",
            "text/javascript"
        );

        wasmURL = await toBlobURL(
            coreBase + "/ffmpeg-core.wasm",
            "application/wasm"
        );

        await ffmpeg.load({
            classWorkerURL: workerBlobURL,
            coreURL: coreURL,
            wasmURL: wasmURL
        });

        status.textContent =
        "جاري تجهيز الملف الصوتي...";

        const extension =
        selectedFile.name.split(".").pop().toLowerCase()
        .replace(/[^a-z0-9]/g, "") || "mp3";

        const inputName = "input." + extension;
        const outputName = "output.mp4";

        await ffmpeg.writeFile(
            inputName,
            new Uint8Array(
                await selectedFile.arrayBuffer()
            )
        );

        status.textContent =
        "جاري إنشاء الفيديو... يرجى الانتظار.";

        // إنشاء فيديو أسود حقيقي بمعدل إطار واحد بالثانية
        await ffmpeg.exec([

            "-f", "lavfi",

            "-i",
            "color=c=black:s=640x360:r=1",

            "-i", inputName,

            "-map", "0:v:0",
            "-map", "1:a:0",

            "-c:v", "libx264",
            "-preset", "ultrafast",
            "-tune", "stillimage",
            "-crf", "45",
            "-r", "1",
            "-pix_fmt", "yuv420p",

            "-c:a", "aac",
            "-b:a", "128k",

            "-shortest",
            "-movflags", "+faststart",

            outputName

        ]);

        status.textContent =
        "جاري تجهيز ملف MP4 للتنزيل...";

        const data = await ffmpeg.readFile(outputName);

        const blob = new Blob([data], {
            type: "video/mp4"
        });

        outputURL = URL.createObjectURL(blob);

        download.href = outputURL;
        download.download = "audio-video.mp4";

        download.textContent =
        "تحميل الفيديو (" +
        (blob.size / 1024 / 1024).toFixed(2) +
        " MB)";

        download.style.display = "block";

        progress.value = 100;

        status.textContent =
        "تم إنشاء الفيديو بنجاح!";

        await ffmpeg.deleteFile(inputName);
        await ffmpeg.deleteFile(outputName);

    } catch (error) {

        console.error(error);

        status.textContent =
        "تعذر التحويل:\n" +
        error.message;

    } finally {

        if (ffmpeg) {
            ffmpeg.terminate();
        }

        if (workerBlobURL) {
            URL.revokeObjectURL(workerBlobURL);
        }

        if (coreURL) {
            URL.revokeObjectURL(coreURL);
        }

        if (wasmURL) {
            URL.revokeObjectURL(wasmURL);
        }

        button.disabled = false;
        fileInput.disabled = false;

    }

});

</script>

</body>
</html>
