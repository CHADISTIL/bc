<style>
:root{--primary:#ff4757;--secondary:#ff0055;--dark:#1a1a2e;--card:rgba(26,26,46,.7);--gold:#f5c518;
--bg:linear-gradient(to bottom,#1a1a2e,#16213e)}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-attachment:fixed;color:#fff;min-height:100vh;overflow-x:hidden}
body.lock{overflow:hidden}
button{cursor:pointer;border:none;color:inherit;background:none}
img{display:block}

/* topbar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;
background:rgba(22,33,62,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;font-size:1.3em;letter-spacing:1px;background:linear-gradient(90deg,#3d9bff,#ff3b5c);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo img{width:30px;height:30px;border-radius:50%;box-shadow:0 0 10px rgba(61,155,255,.5)}
.search{flex:1;position:relative}
.search input{width:100%;padding:10px 40px 10px 14px;border:none;border-radius:22px;background:rgba(255,255,255,.1);color:#fff;font-size:.9em;outline:none}
.search input:focus{background:rgba(255,255,255,.16);box-shadow:0 0 0 2px var(--primary)}
.search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#aaa;font-size:.9em}
.acct{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;position:relative}
.acct img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dlb{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--primary);color:#fff;font-size:.62em;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 4px;border:2px solid var(--bg,#0f0f1a);font-weight:800}
.dlb i{animation:dlsp 1.2s linear infinite}@keyframes dlsp{to{transform:translateY(2px)}}
.dl-pulse{animation:dlpl .6s ease 2}@keyframes dlpl{50%{transform:scale(1.25);box-shadow:0 0 0 8px rgba(255,71,87,.3)}}
.dl-it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.06);margin-bottom:8px}
.dl-it .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,71,87,.15);color:var(--primary)}
.dl-it .ic.ok{background:rgba(46,213,115,.15);color:#2ed573}.dl-it .ic.er{background:rgba(255,255,255,.08);color:#999}
.dl-it .tx{flex:1;min-width:0}.dl-it .tx b{display:block;font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl-it .tx span{font-size:.74em;color:#8f93aa}
.dl-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:7px 0 3px}.dl-bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s}
.dl-it button{border:0;border-radius:50%;width:34px;height:34px;background:rgba(255,255,255,.1);color:#ccc;cursor:pointer;flex:none}

/* tabs */
.tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.08);font-size:.88em;font-weight:500;transition:.2s}
.tab.on{background:var(--primary);font-weight:700}

/* hero */
.hero{position:relative;margin:4px 14px 8px;border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-height:62vh;background:#111;cursor:pointer}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,28,.97) 4%,rgba(10,12,28,.2) 60%,transparent)}
.hero-info{position:absolute;bottom:0;right:0;left:0;padding:16px;z-index:2}
.hero-title{font-size:1.5em;font-weight:800;margin-bottom:6px;text-shadow:0 2px 8px #000}
.hero-meta{display:flex;gap:8px;align-items:center;font-size:.8em;color:#ddd;margin-bottom:8px;flex-wrap:wrap}
.hero-desc{font-size:.82em;color:#ccc;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;max-width:640px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:24px;font-weight:700;font-size:.9em;transition:.2s}
.btn.pri{background:var(--primary)}
.btn.pri:active{transform:scale(.96)}
.btn.sec{background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.45}
.rate{color:var(--gold);font-weight:700}

/* rows */
.sec{margin:14px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:8px}
.sec-t{font-size:1.02em;font-weight:800;display:flex;align-items:center;gap:7px}
.sec-t i{color:var(--primary);font-size:.9em}
.more{font-size:.74em;color:#aaa;background:rgba(255,255,255,.07);padding:5px 13px;border-radius:14px}
.rowx{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.rowx::-webkit-scrollbar{display:none}
.card{flex:0 0 128px;position:relative;border-radius:10px;overflow:hidden;background:#1a1a2e;cursor:pointer;scroll-snap-align:start;transition:transform .2s}
.card:active{transform:scale(.96)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}
.card .ov{position:absolute;bottom:0;left:0;right:0;padding:26px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.card .ct{font-size:.7em;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cr{font-size:.65em;color:var(--gold);margin-top:2px}
.card .bd{position:absolute;top:6px;right:6px;background:var(--primary);font-size:.58em;font-weight:700;padding:2px 6px;border-radius:3px}
.card .pgb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.card .pgb i{display:block;height:100%;background:var(--primary)}
.card .bd.tv{background:#1565c0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:6px 14px 20px}
.grid .card{flex:unset}
.chips{display:flex;gap:8px;padding:4px 14px 8px}
.chip{padding:6px 16px;border-radius:16px;background:rgba(255,255,255,.08);font-size:.8em}
.chip.on{background:rgba(255,71,87,.2);color:var(--primary);outline:1px solid var(--primary)}
.center{text-align:center;padding:30px 14px;color:#aaa}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.page-end{height:80px}

/* detail overlay */
.ov-page{position:fixed;inset:0;z-index:100;background:#12142a;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ov-page.on{display:block}
.d-back{position:fixed;top:12px;right:12px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.d-hero{position:relative;aspect-ratio:16/9;max-height:50vh;width:100%;background:#000}
.d-hero img{width:100%;height:100%;object-fit:cover}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#12142a,transparent 70%)}
.d-body{padding:0 14px 40px;margin-top:-60px;position:relative;z-index:2;max-width:900px;margin-inline:auto}
.jp-slot #favBtn,.jp-slot #listBtn{display:none}
.card .plus{position:absolute;top:6px;left:6px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3);font-size:.7em;display:flex;align-items:center;justify-content:center;color:#fff}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.acts .btn.on{background:rgba(255,71,87,.18);border-color:var(--primary);color:#ff8794}
html.embed .top,html.embed #nav,html.embed #main,html.embed .page-end,html.embed #detail{display:none!important}
html.embed body{background:#000}
html.boot body::after{content:"";position:fixed;inset:0;background:#000;z-index:299}
.jp-slot .d-body{margin-top:8px;padding:0 0 20px}
.cm{cursor:pointer}
.p-head{display:flex;gap:16px;align-items:center;padding:64px 14px 8px;max-width:900px;margin:auto}
.p-head img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#222;flex-shrink:0}
.p-name{font-size:1.25em;font-weight:800;margin-bottom:4px}
.p-sub{font-size:.78em;color:#aab;line-height:1.7}
.p-bio{font-size:.84em;color:#ccc;line-height:1.9;margin:6px 14px 8px;max-width:900px;margin-inline:auto;padding:0 14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.p-bio.open{-webkit-line-clamp:unset;display:block}
.chip.dash{border:1px dashed rgba(255,255,255,.3);background:none;color:#bbb}
.chips{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.chip{white-space:nowrap;flex-shrink:0}
.lhead{display:flex;align-items:center;gap:8px;padding:6px 14px}.lhead b{flex:1;font-size:1.02em}
.ib{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-size:.85em}
.card .rm{position:absolute;top:5px;left:5px;z-index:3;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);font-size:.7em;display:flex;align-items:center;justify-content:center}
.mbox.nc{max-width:440px;padding:0;border-radius:26px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;background:#15151c;border:1px solid rgba(255,255,255,.08)}
.nc-h{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06)}.nc-h h3{margin:0;flex:1;font-size:1.1em}
.nc-ic{width:40px;height:40px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:#fff}
.nc-x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#ddd;cursor:pointer}
.nc-b{overflow:auto;padding:6px 16px 18px}.nc-b .btn{border-radius:999px}
.nc-t{font-weight:700;font-size:.8em;color:#9aa;margin:16px 4px 8px;letter-spacing:.3px}.nc-t em{font-style:normal;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 8px;margin-right:4px}
.nc-sw,.nc-it{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.05);margin-bottom:8px;border:0;color:inherit;text-align:right;cursor:pointer;font:inherit}
.nc .ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#aaa;flex:none}
.nc .ic.k,.nc-sw.on .ic,.nc-it[data-o] .ic{background:rgba(255,71,87,.15);color:var(--primary)}
.nc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.9em}.nc .tx span{color:#9a9aa5;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nc .tx b{font-weight:600}
.nc-it small{color:#777;font-size:.72em;flex:none}
.nc-sw .tg{width:40px;height:23px;border-radius:99px;background:#3a3a44;position:relative;flex:none;transition:.2s}.nc-sw .tg:after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.nc-sw.on .tg{background:var(--primary)}.nc-sw.on .tg:after{right:20px}
.nc-un{border:0;border-radius:99px;background:rgba(255,255,255,.1);color:#ccc;padding:6px 12px;font-size:.75em;cursor:pointer}
.nc-em{text-align:center;color:#777;font-size:.85em;padding:16px;border-radius:18px;border:1px dashed rgba(255,255,255,.12);line-height:1.8}.nc-em i{display:block;font-size:1.5em;margin-bottom:6px;opacity:.6}
.ac-hero{padding:70px 16px 22px;text-align:center;background:linear-gradient(#1d2040,#12142a)}
.ac-av{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;background:var(--primary);display:grid;place-items:center;font-size:2.4em;font-weight:800;overflow:hidden;border:3px solid rgba(255,255,255,.15)}.ac-av img{width:100%;height:100%;object-fit:cover}
.ac-hero h2{font-size:1.25em;margin-bottom:4px}.ac-hero .em{color:#9aa;font-size:.85em;direction:ltr}
.ac-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.ac-tags span{background:rgba(255,255,255,.08);border-radius:99px;padding:5px 13px;font-size:.74em;color:#ccc}.ac-tags i{margin-left:5px;color:var(--primary)}
.ac-st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.ac-s{background:rgba(255,255,255,.06);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.ac-s .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,71,87,.15);color:var(--primary);display:grid;place-items:center;flex:none}
.ac-s b{display:block;font-size:1.4em;line-height:1.1}.ac-s span{font-size:.74em;color:#9aa}
.ac-card{margin:0 14px 14px;background:rgba(255,255,255,.05);border-radius:24px;padding:6px}
.ac-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:18px;font-size:.9em;text-align:right;color:#fff}
.ac-row:active{background:rgba(255,255,255,.06)}
.ac-row .ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none;color:#bbb}
.ac-row small{margin-right:auto;color:#8a8fa8;font-size:.78em}.ac-row.red{color:#ff6b7a}.ac-row.red .ic{background:rgba(255,71,87,.15);color:#ff6b7a}
.ac-cap{padding:0 18px;margin:6px 0 8px;font-weight:700;font-size:.85em;color:#9aa}
.ac-nm{display:flex;gap:8px;padding:8px 12px 12px}.ac-nm .inp{flex:1;margin:0}
.btn.on{background:rgba(255,71,87,.18);color:#ff7a88}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:8px;font-size:.9em;text-align:right}
.lrow i{color:#888;font-size:1.1em}.lrow.on i{color:var(--primary)}.lrow small{margin-right:auto;color:#999;font-size:.75em}
.lrow.sug{border:1px dashed rgba(255,255,255,.3);background:none}
.row2{display:flex;gap:8px;margin-top:6px}.row2 .inp{margin:0;flex:1}
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-poster{width:108px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);flex-shrink:0;background:#222}
.d-info{flex:1;min-width:0;padding-top:4px}
.d-title{font-size:1.3em;font-weight:800;line-height:1.35;margin-bottom:8px}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;font-size:.82em;color:#b8bdd0;margin-bottom:10px}
.d-meta span+span::before{content:"·";margin:0 8px;color:#666}
.d-meta .rate{color:var(--gold);font-weight:800}
.d-gen{display:flex;flex-wrap:wrap;gap:6px}
.d-gen span{font-size:.72em;padding:4px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.16);color:#d5d9e6}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0 4px}
.acts .btn{justify-content:center;border-radius:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.1)}
.acts .btn.sec{background:rgba(255,255,255,.07)}
.fav-b.on{background:rgba(255,0,85,.2);color:var(--secondary)}
.desc{font-size:.86em;color:#ccc;line-height:1.9;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;margin:10px 0}
.h2{font-size:.95em;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:7px}
.h2 i{color:var(--primary)}
.cast{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.cm{flex:0 0 68px;text-align:center}
.cm img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 4px;background:#222}
.cm div{font-size:.62em;color:#ccc;line-height:1.3}
.sel{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:.85em;outline:none}
.sel option{background:#1a1a2e}
.eps{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ep{display:flex;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden;cursor:pointer}
.ep.off{opacity:.5}
.ep img{width:130px;aspect-ratio:16/9;object-fit:cover;flex-shrink:0;background:#222}
.ep-i{padding:8px 4px;min-width:0;flex:1}
.ep-t{font-size:.82em;font-weight:700;margin-bottom:3px}
.ep-m{font-size:.68em;color:#999}
.ep-m .ok{color:#00c853}

/* player */

/* auth modal */
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:linear-gradient(160deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 20px;width:100%;max-width:360px}
.mbox h3{text-align:center;margin-bottom:14px}
.mtabs{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;margin-bottom:14px}
.mtabs button{flex:1;padding:8px;border-radius:10px;font-size:.85em}
.mtabs button.on{background:var(--primary);font-weight:700}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:10px;padding:11px 14px;color:#fff;font-size:.9em;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--primary)}
.g-btn{width:100%;background:#fff;color:#222;border-radius:10px;padding:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.sep{text-align:center;color:#777;font-size:.75em;margin:6px 0 10px}
.err{color:#ff6b7a;font-size:.78em;min-height:1.2em;margin-bottom:8px;text-align:center}
.menu{position:absolute;top:56px;left:12px;background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;min-width:180px;z-index:60;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu.on{display:block}
.menu div{padding:10px 12px;font-size:.85em;border-radius:8px}
.menu .em{color:#aaa;font-size:.75em;word-break:break-all}
.menu button{width:100%;text-align:right;padding:10px 12px;border-radius:8px;font-size:.85em;color:#ff6b7a}
.menu button:active{background:rgba(255,255,255,.08)}

/* toast */
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(14,18,38,.97);padding:10px 20px;border-radius:22px;font-size:.84em;opacity:0;transition:.25s;pointer-events:none;z-index:999;border:1px solid rgba(255,255,255,.1);white-space:nowrap}

/* bottom nav */

<script type="module">

  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBeSb5lSBNQGl8TmwNbga39w6kfOk0jk8E",
  authDomain:"spacepower-f4ebe.firebaseapp.com",
  projectId:"spacepower-f4ebe",

const auth=getAuth(app), db=getFirestore(app);

/* ───── TMDB ───── */
const KEY="1427d0e123035564137327f27f47c86c", API="https://api.themoviedb.org/3", IMG="https://image.tmdb.org/t/p/";
const cache=new Map();
async function tm(path,p={}){
  const u=`${API}${path}?`+new URLSearchParams({api_key:KEY,language:"en-US",...p});
  if(cache.has(u)) return cache.get(u);
  const r=await fetch(u); if(!r.ok) throw new Error("TMDB "+r.status);
  const j=await r.json(); cache.set(u,j); return j;
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(x,type){
  const t=x.media_type||type;
  return {id:x.id,type:t,title:x.title||x.name||x.original_title||x.original_name||"",
    poster:x.poster_path?IMG+"w342"+x.poster_path:"",
    backdrop:x.backdrop_path?IMG+"w1280"+x.backdrop_path:"",
    rating:x.vote_average?Math.round(x.vote_average*10)/10:0,
    year:(x.release_date||x.first_air_date||"").slice(0,4),
    overview:x.overview||""};
}
let hid=new Set();
const hidP=getDoc(doc(db,"settings","hidden")).then(s=>{if(s.exists())hid=new Set(s.data().items||[])}).catch(()=>{});
const list=(r,type,keep)=>(r.results||[]).filter(x=>(x.media_type||type)!=="person"&&x.poster_path&&(keep||!hid.has((x.media_type||type)+"_"+x.id))).map(x=>norm(x,type));
const ANIME={with_genres:"16",with_original_language:"ja"};
const SRC={
  movie:{pop:["/movie/popular",{}],top:["/discover/movie",{sort_by:"vote_average.desc","vote_count.gte":"1500"}]},
  tv:{pop:["/tv/popular",{}],top:["/discover/tv",{sort_by:"vote_average.desc","vote_count.gte":"800"}]},
  anime:{pop:["/discover/tv",{...ANIME,sort_by:"popularity.desc"}],top:["/discover/tv",{...ANIME,sort_by:"vote_average.desc","vote_count.gte":"300"}]}
};
const baseType=k=>k==="anime"?"tv":k;

/* ───── helpers ───── */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
function card(it,opt){
  const d=document.createElement("div");d.className="card";
  const plus=!(opt&&opt.plus===false);
  d.innerHTML=`<img loading="lazy" src="${esc(it.poster)}" alt="" draggable="false"><div class="bd ${it.type==="tv"?"tv":""}">${it.type==="tv"?"مسلسل":"فيلم"}</div>
  ${plus?`<button class="plus" aria-label="إضافة إلى قائمة"><i class="fas fa-plus"></i></button>`:""}
  <div class="ov"><div class="ct">${esc(it.title)}</div>${it.rating?`<div class="cr"><i class="fas fa-star"></i> ${it.rating}</div>`:""}</div>`;
  let timer=null,lp=false,sx=0,sy=0;
  const clear=()=>{clearTimeout(timer);timer=null};
  d.addEventListener("pointerdown",e=>{if(e.target.closest(".plus,.rm"))return;lp=false;sx=e.clientX;sy=e.clientY;clear();timer=setTimeout(()=>{lp=true;try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}openListModal(it)},520)});
  d.addEventListener("pointermove",e=>{if(timer&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))clear()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>d.addEventListener(ev,clear));
  d.addEventListener("contextmenu",e=>e.preventDefault());
  const pb=d.querySelector(".plus");if(pb)pb.onclick=e=>{e.stopPropagation();openListModal(it)};
  if(it.type==="tv"&&it.ep)d.querySelector(".ov").insertAdjacentHTML("beforeend",`<div class="cr">S${it.ep.s} E${it.ep.e}</div>`);
  d.onclick=()=>{if(lp){lp=false;return}it.type==="tv"?openTv(it):openDetail(it.type,it.id)};
  return d;
}
async function openTv(it){
  if(it.ep)return openDetail("tv",it.id,it.ep);
  const h=histCache.get(favId("tv",it.id));
  if(h&&h.season)return openDetail("tv",it.id,{s:h.season,e:h.episode});
  try{
    const sn=await getDocs(collection(db,"titles",favId("tv",it.id),"episodes"));let best=null;
    sn.forEach(x=>{const v=x.data();if(!((v.qualities&&v.qualities.length)||v.url))return;if(!best||v.season<best.s||(v.season===best.s&&v.episode<best.e))best={s:v.season,e:v.episode}});
    if(best)return openDetail("tv",it.id,best);
  }catch(e){}
  openDetail("tv",it.id);
}
function row(title,icon,items,moreKey){
  const s=document.createElement("section");s.className="sec";
  s.innerHTML=`<div class="sec-h"><div class="sec-t"><i class="fas ${icon}"></i>${esc(title)}</div>${moreKey?`<button class="more">المزيد</button>`:""}</div><div class="rowx"></div>`;
  const r=s.querySelector(".rowx");items.forEach(i=>r.appendChild(card(i)));
  if(moreKey) s.querySelector(".more").onclick=()=>goTab(moreKey[0],moreKey[1]);
  return s;
}
const spinner=()=>`<div class="spin"></div>`;

/* ───── navigation ───── */
let curTab="home";
function setTabUI(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
function setNavUI(n){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.n===n))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>goTab(b.dataset.t));
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  const n=b.dataset.n;
  if(n==="home") goTab("home");
  else if(n==="search"){goTab("home");$("#q").focus()}
  else if(n==="hist")showHist();
  else showFavs();
});
function goTab(t,sort){
  curTab=t;setPres({k:"tab",label:t});setTabUI(t);setNavUI("home");$("#q").value="";window.scrollTo(0,0);
  if(t==="home") renderHome(); else renderGrid(t,sort||"pop");
}

/* ───── home (configurable from admin: settings/home) ───── */
const DEFAULT_HOME={hero:"trend",sections:[
 {id:"trend",title:"الشائع الآن",icon:"fa-fire",source:"trending",mtype:"all",period:"week",limit:20,enabled:true},
 {id:"mpop",title:"أفلام شائعة",icon:"fa-film",source:"popular",mtype:"movie",limit:20,more:true,enabled:true},
 {id:"mtop",title:"الأفلام الأعلى تقييماً",icon:"fa-star",source:"top",mtype:"movie",limit:20,more:true,enabled:true},
 {id:"tpop",title:"مسلسلات شائعة",icon:"fa-tv",source:"popular",mtype:"tv",limit:20,more:true,enabled:true},
 {id:"ttop",title:"المسلسلات الأعلى تقييماً",icon:"fa-trophy",source:"top",mtype:"tv",limit:20,more:true,enabled:true},
 {id:"apop",title:"أنمي شائع",icon:"fa-wand-sparkles",source:"popular",mtype:"anime",limit:20,more:true,enabled:true},
 {id:"atop",title:"الأنمي الأعلى تقييماً",icon:"fa-crown",source:"top",mtype:"anime",limit:20,more:true,enabled:true}]};
let homeCfg=null;
async function loadHomeCfg(){
  await hidP;
  if(homeCfg)return homeCfg;
  try{const s=await getDoc(doc(db,"settings","home"));if(s.exists()&&Array.isArray(s.data().sections)&&s.data().sections.length)homeCfg=s.data()}catch(e){}
  return homeCfg||(homeCfg=DEFAULT_HOME);
}
const today=()=>new Date().toISOString().slice(0,10);
async function fetchSection(sc){
  const mt=sc.mtype||"movie",bt=baseType(mt),n=+sc.limit||20;
  let items=[];
  switch(sc.source){
    case"trending":items=list(await tm(`/trending/${mt==="all"?"all":bt}/${sc.period||"week"}`),mt==="all"?undefined:bt);break;
    case"popular":case"top":
      items=mt==="all"?list(await tm("/trending/all/week")):list(await tm(...SRC[mt][sc.source==="top"?"top":"pop"]),bt);break;
    case"now":
      if(mt==="movie")items=list(await tm("/movie/now_playing"),"movie");
      else if(mt==="anime")items=list(await tm("/discover/tv",{...ANIME,sort_by:"first_air_date.desc","first_air_date.lte":today(),"vote_count.gte":"5"}),"tv");
      else items=list(await tm("/tv/on_the_air"),"tv");break;
    case"upcoming":items=list(await tm("/movie/upcoming"),"movie");break;
    case"discover":{
      const p={sort_by:sc.sort==="vote"?"vote_average.desc":sc.sort==="date"?(bt==="movie"?"primary_release_date.desc":"first_air_date.desc"):"popularity.desc"};
      if(sc.sort==="vote")p["vote_count.gte"]=String(sc.minVotes||(bt==="movie"?1000:400));
      if(sc.sort==="date"){p[bt==="movie"?"primary_release_date.lte":"first_air_date.lte"]=today();p["vote_count.gte"]="5"}
      let g=String(sc.genres||"").replace(/\s/g,"");
      if(mt==="anime"){g=g?"16,"+g:"16";p.with_original_language=sc.lang||"ja"}
      else if(sc.lang)p.with_original_language=sc.lang;
      if(g)p.with_genres=g;
      items=list(await tm("/discover/"+bt,p),bt);break}
    case"views":{
      const q=await getDocs(query(collection(db,"stats"),orderBy("views","desc"),limit(n*2)));
      q.forEach(d=>{const x=d.data();if(mt!=="all"&&baseType(mt)!==x.type)return;items.push({id:x.tmdbId,type:x.type,title:x.title,poster:x.poster,backdrop:"",rating:0,year:"",overview:""})});break}
    case"added":{
      const q=await getDocs(query(collection(db,"titles"),orderBy("updatedAt","desc"),limit(n*2)));
      const docs=[];q.forEach(d=>{const x=d.data();if(mt==="all"||baseType(mt)===x.type)docs.push(x)});
      const r=await Promise.all(docs.slice(0,n).map(x=>tm(`/${x.type}/${x.tmdbId}`).then(d=>({...norm({...d,media_type:x.type},x.type),ep:x.type==="tv"&&x.lastSeason?{s:x.lastSeason,e:x.lastEpisode}:null})).catch(()=>null)));
      items=r.filter(x=>x&&x.poster);break}
    case"ids":{
      const ids=String(sc.ids||"").split(/[,،\s]+/).map(t=>t.match(/^(movie|tv)[:\/_-]?(\d+)$/i)).filter(Boolean);
      const r=await Promise.all(ids.slice(0,n).map(m=>tm(`/${m[1].toLowerCase()}/${m[2]}`).then(d=>norm({...d,media_type:m[1].toLowerCase()},m[1].toLowerCase())).catch(()=>null)));
      items=r.filter(x=>x&&x.poster);break}
  }
  return items.slice(0,n);
}
let heroTimer;
async function renderHome(){
  const m=$("#main");m.innerHTML=spinner();clearInterval(heroTimer);
  try{
    const cfg=await loadHomeCfg();
    const secs=cfg.sections.filter(x=>x.enabled!==false);
    const res=await Promise.all(secs.map(x=>fetchSection(x).catch(()=>[])));
    if(curTab!=="home")return;
    m.innerHTML="";
    if(cfg.hero!==""){
      let hi=secs.findIndex(x=>x.id===cfg.hero);if(hi<0)hi=0;
      const heroItems=(res[hi]||[]).filter(x=>x.backdrop).slice(0,5);
      await Promise.all(heroItems.map(async x=>{try{const a=await tm(`/${x.type}/${x.id}`,{language:"ar"});if(a.overview)x.overview=a.overview}catch(e){}}));
      if(heroItems.length)m.appendChild(buildHero(heroItems));
    }
    secs.forEach((x,i)=>{
      if(!res[i].length)return;
      const more=x.more&&(x.source==="popular"||x.source==="top")&&SRC[x.mtype]?[x.mtype,x.source==="top"?"top":"pop"]:null;
      m.appendChild(row(x.title,x.icon||"fa-film",res[i],more));
    });
    updateHistRow();updateActRow();
  }catch(e){m.innerHTML=`<div class="center">تعذر تحميل المحتوى، تحقق من الاتصال</div>`}
}
function buildHero(items){
  const h=document.createElement("div");h.className="hero";let i=0;
  function paint(){
    const it=items[i];
    h.innerHTML=`<img class="bg" src="${esc(it.backdrop)}" alt="">
    <div class="hero-info"><div class="hero-title">${esc(it.title)}</div>
    <div class="hero-meta"><span class="rate"><i class="fas fa-star"></i> ${it.rating}</span><span>${esc(it.year)}</span><span>${it.type==="tv"?"مسلسل":"فيلم"}</span></div>
    <div class="hero-desc">${esc(it.overview)}</div>
    <button class="btn pri"><i class="fas fa-circle-info"></i> التفاصيل</button></div>`;
    h.onclick=()=>openDetail(it.type,it.id);
  }
  paint();
  heroTimer=setInterval(()=>{if(!h.isConnected){clearInterval(heroTimer);return}i=(i+1)%items.length;paint()},7000);
  return h;
}

/* ───── grid tabs (movies / tv / anime) ───── */
let gridState={page:1,loading:false,key:"",sort:"pop",done:false};
async function renderGrid(key,sort){
  gridState={page:1,loading:false,key,sort,done:false};
  const m=$("#main");
  m.innerHTML=`<div class="chips"><button class="chip ${sort==="pop"?"on":""}" data-s="pop">الشائع</button><button class="chip ${sort==="top"?"on":""}" data-s="top">الأعلى تقييماً</button></div><div class="grid" id="grid"></div><div id="gmore"></div>`;
  m.querySelectorAll(".chip").forEach(c=>c.onclick=()=>renderGrid(key,c.dataset.s));
  await loadMoreGrid();
}
async function loadMoreGrid(){
  const g=gridState;if(g.loading||g.done)return;g.loading=true;
  const gm=$("#gmore");if(gm)gm.innerHTML=spinner();
  try{
    const [path,p]=SRC[g.key][g.sort];
    const r=await tm(path,{...p,page:g.page});
    if(gridState!==g)return;
    const grid=$("#grid");if(!grid)return;
    list(r,baseType(g.key)).forEach(i=>grid.appendChild(card(i)));
    g.page++;g.done=g.page>Math.min(r.total_pages||1,20);
    gm.innerHTML=g.done?"":`<div class="center"><button class="btn sec" id="lm">تحميل المزيد</button></div>`;
    const lm=$("#lm");if(lm)lm.onclick=loadMoreGrid;
  }catch(e){if($("#gmore"))$("#gmore").innerHTML=`<div class="center">تعذر التحميل</div>`}
  g.loading=false;
}

/* ───── search ───── */
let sT;
$("#q").addEventListener("input",e=>{
  clearTimeout(sT);const q=e.target.value.trim();
  if(q.length<2){if(!q)goTab(["home","movie","tv","anime"].includes(curTab)?curTab:"home");return}
  sT=setTimeout(()=>doSearch(q),450);
});
async function doSearch(q){
  const m=$("#main");m.innerHTML=spinner();
  try{
    const r=await tm("/search/multi",{query:q});
    const items=list(r,undefined,true);
    m.innerHTML=items.length?`<div class="sec-h" style="margin-top:12px"><div class="sec-t"><i class="fas fa-magnifying-glass"></i>نتائج البحث</div></div><div class="grid" id="sg"></div>`:`<div class="center">لا توجد نتائج</div>`;
    const g=$("#sg");if(g)items.forEach(i=>g.appendChild(card(i)));
  }catch(e){m.innerHTML=`<div class="center">تعذر البحث</div>`}
}


/* ───── التحميلات ───── */
const fmtSz=b=>!b?"":b>=1073741824?(b/1073741824).toFixed(2)+" GB":(b/1048576).toFixed(1)+" MB";
const dAgo=t=>{const d=(Date.now()-t)/1000;return d<60?"الآن":d<3600?Math.floor(d/60)+" د":d<86400?Math.floor(d/3600)+" س":Math.floor(d/86400)+" ي"};
function updDlBadge(){
  const a=$("#acct");if(!a||!window.JP||!JP.dlList)return;
  const n=JP.dlList().active.length;let b=a.querySelector(".dlb");
  if(!n){if(b)b.remove();return}
  if(!b){b=document.createElement("span");b.className="dlb";a.appendChild(b)}
  b.innerHTML=`<i class="fas fa-arrow-down"></i>${n}`;
}
function drawDownloads(){
  const ov=$("#dlPage");if(!ov.classList.contains("on"))return;
  const L=JP.dlList();
  const keep=ov.scrollTop;
  ov.innerHTML=`<button class="d-back" id="dlback"><i class="fas fa-arrow-right"></i></button>

  const key=favId(it.type,it.id),old=histCache.get(key);
  const same=old&&(old.season||0)===(se||0)&&(old.episode||0)===(ep||0);
  const d={type:it.type,tmdbId:it.id,title:it.title,poster:it.poster,season:se||0,episode:ep||0,pos:same?old.pos||0:0,dur:same?old.dur||0:0,watchedAt:Date.now()};

    ${fs.length?fs.map((f,i)=>`<div class="nc-it" data-o="${i}"><span class="ic"><i class="fas fa-tv"></i></span><div class="tx"><b>${esc(f.title)}</b></div><button class="nc-un" data-u="${i}">إلغاء</button></div>`).join(""):`<div class="nc-em"><i class="fas fa-bell-slash"></i>اضغط «متابعة» في صفحة أي مسلسل يُعرض حالياً أو عمل قادم</div>`}

    ${recent.length?recent.slice(0,12).map((r,i)=>`<div class="nc-it" data-r="${i}"><span class="ic k"><i class="fas ${KI[r.kind]||"fa-bell"}"></i></span><div class="tx"><b>${esc(r.title)}</b><span>${esc(r.body)}</span></div><small>${ago(r.ts)}</small></div>`).join(""):`<div class="nc-em"><i class="fas fa-inbox"></i>لا توجد إشعارات بعد</div>`}
    </div></div>`;
    m.querySelector("#n-x").onclick=()=>m.remove();
    const ib=m.querySelector("#n-in");if(ib)ib.onclick=async()=>{installEv.prompt();try{await installEv.userChoice}catch(e){}installEv=null;draw()};
    const tg=m.querySelector("#n-tg");
    if(tg)tg.onclick=async()=>{if(on)await disablePush();else await enablePush();draw()};
    m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=getTopics();t[b.dataset.t]=!t[b.dataset.t];LSset("sp_topics",t);syncPush();draw()});
    m.querySelectorAll("[data-o]").forEach(b=>b.onclick=e=>{
      const f=fs[+b.dataset.o];
      if(e.target.closest("[data-u]")){fs.splice(+b.dataset.o,1);LSset("sp_follows",fs);syncPush();draw();return}
      m.remove();openDetail(f.type,f.id);
    });
    m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=recent[+b.dataset.r];m.remove();if(/^https?:/i.test(r.url||""))window.open(r.url,"_blank");else goHash(r.url)});
  };
  draw();
}

/* ───── detail ───── */
const setHash=h=>{try{history.replaceState(history.state,"",h||location.pathname+location.search)}catch(e){}};
const embedLink=(t,id,se,ep)=>location.href.split("#")[0]+"#/embed/"+t+"/"+id+(se?`/${se}/${ep}`:"");
const shareLink=(t,id,se,ep)=>(window.SP_CONFIG&&SP_CONFIG.push?SP_CONFIG.push+"/s/"+t+"/"+id+(se?`/${se}/${ep}`:""):location.href.split("#")[0]+"#/"+t+"/"+id+(se?`/${se}/${ep}`:""));
async function openDetail(type,id,epSel){
  $("#person").classList.remove("on");
  if(window.JP&&JP.isOpen())JP.close();
  setHash(`#/${type}/${id}`);
  const ov=$("#detail");ov.innerHTML=`<button class="d-back" id="dback"><i class="fas fa-arrow-right"></i></button>${spinner()}`;
  ov.classList.add("on");document.body.classList.add("lock");ov.scrollTop=0;
  $("#dback").onclick=closeDetail;
  try{
    const [d,own,en,simR]=await Promise.all([
      tm(`/${type}/${id}`,{language:"ar",append_to_response:"credits"}),
      getDoc(doc(db,"titles",favId(type,id))).catch(()=>null),
      tm(`/${type}/${id}`,{append_to_response:"videos"}),
      tm(`/${type}/${id}/similar`)
    ]);
    const it=norm({...d,title:en.title,name:en.name,media_type:type},type);
    curDetail={title:it.title,type,id};setPres({k:"detail",label:it.title,type,tmdbId:id});
    const link=own&&own.exists()?own.data():null;
    const quals=link?normQuals(link):[];
    const trailer=(en.videos?.results||[]).find(v=>v.site==="YouTube"&&v.type==="Trailer");
    const cast=(d.credits?.cast||[]).slice(0,12).map(c=>`<div class="cm" data-p="${c.id}"><img loading="lazy" src="${c.profile_path?IMG+"w185"+c.profile_path:`https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=1a1a2e&color=fff`}" alt=""><div>${esc(c.name)}</div></div>`).join("");
    const sim=list(simR,type).slice(0,12);
    ov.innerHTML=`<button class="d-back" id="dback"><i class="fas fa-arrow-right"></i></button><button class="d-back" id="dshare" style="right:auto;left:12px"><i class="fas fa-share-nodes"></i></button>
    <div class="d-hero"><img src="${esc(d.backdrop_path?IMG+"w1280"+d.backdrop_path:it.poster)}" alt=""></div>
    <div class="d-body">
      <div class="d-top"><img class="d-poster" src="${esc(it.poster)}" alt="">
        <div class="d-info"><div class="d-title">${esc(it.title)}</div>
        <div class="d-meta"><span class="rate"><i class="fas fa-star"></i> ${it.rating}</span><span>${esc(it.year)}</span><span>${type==="tv"?"مسلسل":"فيلم"}</span>${d.runtime?`<span>${d.runtime} د</span>`:""}${d.number_of_seasons?`<span>${d.number_of_seasons} مواسم</span>`:""}</div>
        <div class="d-gen">${(d.genres||[]).map(g=>`<span>${esc(g.name)}</span>`).join("")}</div></div></div>
      <div class="acts" id="acts"></div>
      ${d.overview?`<div class="desc">${esc(d.overview)}</div>`:""}
      <div id="epsBox"></div>
      ${cast?`<div class="h2"><i class="fas fa-users"></i>طاقم العمل</div><div class="cast">${cast}</div>`:""}
      <div id="simBox"></div>
    </div>`;
    {const sb=$("#dshare");if(sb)sb.onclick=()=>{const u=shareLink(type,id,epSel&&epSel.s,epSel&&epSel.e);if(navigator.share)navigator.share({title:it.title,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast("تم نسخ الرابط")}catch(e){prompt("انسخ الرابط",u)}}}}
  $("#dback").onclick=closeDetail;
    ov.querySelectorAll(".cm").forEach(el=>el.onclick=()=>openPerson(+el.dataset.p));
    if(link)trackVisit(it);
    const acts=$("#acts");
    if(type==="movie"){
      if(quals.length){
        const bodyEl=ov.querySelector(".d-body");
        closeDetail();
        const h=histTrack(it,0,0);
        play({...h,title:it.title,quals,subtitle:link.subtitle,poster:it.poster,backdrop:d.backdrop_path?IMG+"w1280"+d.backdrop_path:it.poster,chips:[it.year,"فيلم"].filter(Boolean),kind:"movie",fav:favFor(it),slot:bodyEl,shareUrl:shareLink("movie",id),embedUrl:embedLink("movie",id),onClose:()=>setHash("")});
        setHash(`#/movie/${id}`);
      }else{
        const b=document.createElement("button");b.className="btn sec";b.innerHTML=`<i class="fas fa-clock"></i> غير متوفر بعد`;b.style.cssText="opacity:.6;cursor:default";b.onclick=()=>toast("لم يُضف رابط المشاهدة بعد");acts.appendChild(b);
      }
    }
    if(trailer){const t=document.createElement("button");t.className="btn sec";
      const setT=b=>{t.dataset.back=b?"1":"";t.innerHTML=b?`<i class="fas fa-rotate-left"></i> العودة لمشاهدة الفيلم`:`<i class="fab fa-youtube"></i> التريلر`};
      setT(false);
      t.onclick=()=>{
      if(t.dataset.back){JP.endTrailer();setT(false);return}
      if(JP.isOpen()&&JP.trailer&&JP.trailer(trailer.key)){setT(true);window.addEventListener("jp-close",()=>setT(false),{once:true});return}

      const bodyEl=$("#acts").closest(".d-body"),dt=$("#detail");
      setPres({k:"watch",label:it.title+" (Trailer)",type,tmdbId:id});
      play({title:it.title+" - Trailer",yt:trailer.key,poster:it.poster,backdrop:d.backdrop_path?IMG+"w1280"+d.backdrop_path:it.poster,kind:"trailer",chips:[],slot:bodyEl,fav:favFor(it),shareUrl:shareLink(type,id),onClose:()=>{if(dt.classList.contains("on")&&bodyEl.parentNode!==dt)dt.appendChild(bodyEl);backPres()}})};acts.appendChild(t)}
    const fb=document.createElement("button");fb.className="btn sec fav-b";fb.id="favBtn";fb.dataset.fid=favId(type,id);syncFav(fb);fb.onclick=()=>toggleFav(fb,it);acts.appendChild(fb);
    const lb=document.createElement("button");lb.className="btn sec";lb.id="listBtn";lb.innerHTML=`<i class="fas fa-bookmark"></i> إضافة لقائمة`;lb.onclick=()=>openListModal(it);acts.appendChild(lb);
    {const rel=d.release_date||d.first_air_date||"";
     const fol=(type==="tv"&&["Returning Series","In Production","Planned","Pilot"].includes(d.status))||(rel&&rel>today())||["Planned","In Production","Post Production","Rumored"].includes(d.status);
     if(fol){const fb2=document.createElement("button");fb2.className="btn sec";fb2.id="folBtn";syncFollowBtn(fb2,favId(type,id));fb2.onclick=()=>toggleFollow(it,fb2);acts.appendChild(fb2)}}
    if(type==="tv") renderEpisodes(d,it,epSel);
    if(sim.length){$("#simBox").innerHTML=`<div class="h2"><i class="fas fa-clone"></i>مشابه</div><div class="rowx" style="padding:0"></div>`;sim.forEach(s=>$("#simBox .rowx").appendChild(card(s)))}
  }catch(e){ov.innerHTML=`<button class="d-back" id="dback"><i class="fas fa-arrow-right"></i></button><div class="center" style="padding-top:90px">تعذر تحميل التفاصيل</div>`;$("#dback").onclick=closeDetail}
}
function closeDetail(){curDetail=null;backPres();setHash("");$("#detail").classList.remove("on");document.body.classList.remove("lock")}

async function renderEpisodes(d,it,epSel){
  const box=$("#epsBox"),bodyEl=box.closest(".d-body");
  const info=document.createElement("div");bodyEl.insertBefore(info,bodyEl.firstChild);
  const seasons=(d.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0);
  if(!seasons.length)return;
  let epLinks={};
  try{const s=await getDocs(collection(db,"titles",favId("tv",d.id),"episodes"));s.forEach(x=>epLinks[x.id]=x.data())}catch(e){}
  box.innerHTML=`<div class="h2"><i class="fas fa-list-ol"></i>الحلقات</div><select class="sel" id="seasonSel">${seasons.map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join("")}</select><div class="eps" id="eps"></div>`;
  if(epSel&&seasons.some(x=>x.season_number===epSel.s))$("#seasonSel").value=epSel.s;
  const load=async()=>{
    const n=$("#seasonSel").value,eps=$("#eps");eps.innerHTML=spinner();
    try{
      const r=await tm(`/tv/${d.id}/season/${n}`,{language:"ar"});
      eps.innerHTML="";
      const allEps=r.episodes||[];
      const mk=ep=>{const l=epLinks[`s${n}e${ep.episode_number}`];return{ep,l,q:l?normQuals(l):[]}};
      const back=()=>{const dt=$("#detail");if(dt.classList.contains("on")){if(bodyEl.parentNode!==dt)dt.appendChild(bodyEl);setHash(`#/tv/${d.id}`)}else setHash("")};
      const playEp=i=>{const c=mk(allEps[i]);if(!c.q.length)return;
        const img=c.ep.still_path;
        info.innerHTML=c.ep.overview?`<div class="desc"><b>${esc(c.ep.name||"")}</b><br>${esc(c.ep.overview)}</div>`:"";
        const h=histTrack(it,+n,c.ep.episode_number);
        play({...h,title:`${it.title} - S${n} E${c.ep.episode_number}`,quals:c.q,subtitle:c.l.subtitle,poster:img?IMG+"w300"+img:it.poster,backdrop:img?IMG+"w780"+img:it.poster,chips:[`S${n}`,`E${c.ep.episode_number}`],kind:"episode",fav:favFor(it),slot:bodyEl,
          shareUrl:shareLink("tv",d.id,n,c.ep.episode_number),embedUrl:embedLink("tv",d.id,n,c.ep.episode_number),onClose:back,
          next:()=>{for(let j=i+1;j<allEps.length;j++){if(mk(allEps[j]).q.length)return{title:`${it.title} - S${n} E${allEps[j].episode_number}`,play:()=>playEp(j)}}return null}});
        setHash(`#/tv/${d.id}/${n}/${c.ep.episode_number}`);
      };
      allEps.forEach((e,i)=>{
        const qs=mk(e).q;
        const el=document.createElement("div");el.className="ep"+(qs.length?"":" off");
        el.innerHTML=`<img loading="lazy" src="${e.still_path?IMG+"w300"+e.still_path:esc(it.poster)}" alt="">
        <div class="ep-i"><div class="ep-t">${e.episode_number}. ${esc(e.name)}</div><div class="ep-m">${qs.length?`<span class="ok"><i class="fas fa-circle-play"></i> متاحة</span>`:"غير متوفرة بعد"}${e.runtime?` · ${e.runtime} د`:""}</div></div>`;
        el.onclick=()=>qs.length?playEp(i):toast("هذه الحلقة غير متوفرة بعد");
        eps.appendChild(el);
      });
      if(epSel&&!epSel.done&&+n===epSel.s){epSel.done=true;const i=allEps.findIndex(x=>x.episode_number===epSel.e);if(i>=0)playEp(i)}
    }catch(e){eps.innerHTML=`<div class="center">تعذر تحميل الحلقات</div>`}
  };
  $("#seasonSel").onchange=load;load();
}

/* ───── player ───── */
function normQuals(o){
  let q=[];
  if(Array.isArray(o.qualities))q=o.qualities.filter(x=>x&&x.url).map(x=>({label:x.label||"تلقائي",url:x.url}));
  if(!q.length&&o.watchUrl)q=[{label:"تلقائي",url:o.watchUrl}];
  if(!q.length&&o.url)q=[{label:"تلقائي",url:o.url}];
  return q;
}
function favFor(it){
  const id=favId(it.type,it.id);
  return{is:()=>favSet.has(id),toggle:async()=>{
    if(!user){openAuth("سجّل الدخول لحفظ المفضلة");return null}
    const b=document.createElement("button");b.dataset.fid=id;await toggleFav(b,it);return favSet.has(id)}};
}
async function resolveQ(quals){
  const base=window.SP_CONFIG&&SP_CONFIG.push;let embed="";const out=[];
  for(const q of quals){
    const m=/^vcdn:([\w-]+)$/i.exec(q.url);
    if(!m){out.push(q);continue}
    try{const j=await(await fetch(base+"/vcdn-play?id="+m[1])).json();embed=j.embed||embed;if(j.streamUrl)out.push({...q,url:j.streamUrl,vid:m[1]});else console.warn("vcdn",j)}catch(e){}
  }
  return{quals:out,embed,refresh:async q=>{try{const j=await(await fetch(base+"/vcdn-play?id="+q.vid)).json();return j.streamUrl||""}catch(e){return""}}};
}
function showEmbed(embed,o){
  const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:600;background:#000";
  d.innerHTML=`<button style="position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff"><i class="fas fa-xmark"></i></button><iframe src="${esc(embed)}" style="width:100%;height:100%;border:0" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe>`;
  d.querySelector("button").onclick=()=>{d.remove();try{o.onClose&&o.onClose()}catch(e){}};
  document.body.appendChild(d);
}
async function play(o){
  if(!window.JP){toast("المشغّل غير محمّل — تأكد من رفع player.js");return}
  if(o.quals&&o.quals.some(q=>/^vcdn:/i.test(q.url))){
    const q0=o.quals;
    o.resolve=async()=>{
      const r=await resolveQ(q0);
      if(r.quals.length)return{quals:r.quals,refresh:r.refresh};
      if(r.embed){try{JP.close()}catch(e){}showEmbed(r.embed,o);return null}
      toast("تعذر تشغيل الفيديو");try{JP.close()}catch(e){}return null;
    };
  }
  if(o.rep){
    o.onReport=r=>addReport(o.rep,r);
    const R=o.rep,oc=o.onClose;
    setPres({k:"watch",label:R.title,type:R.type,tmdbId:R.tmdbId,season:R.season,episode:R.episode,ref:o.embed?(()=>{try{return new URL(document.referrer).host}catch(e){return"embed"}})():""});
    o.onClose=()=>{try{oc&&oc()}catch(e){}backPres()};
  }
  JP.open(o);
}
(function(){const f=()=>{if(window.JP&&JP.setRefresher)JP.setRefresher(async v=>{try{const j=await(await fetch(SP_CONFIG.push+"/vcdn-play?id="+v)).json();return j.streamUrl||""}catch(e){return""}});else setTimeout(f,500)};f()})();
getDoc(doc(db,"settings","vast")).then(s=>{if(s.exists()&&window.JP)JP.configure({vast:s.data()})}).catch(()=>{});

async function runEmbed(type,id,se,ep){
  try{const v=await getDoc(doc(db,"settings","vast"));if(v.exists()&&window.JP)JP.configure({vast:v.data()})}catch(e){}
  try{
    if(type==="tv"){se=se||1;ep=ep||1}
    const [d,own]=await Promise.all([
      tm(`/${type}/${id}`),
      getDoc(type==="movie"?doc(db,"titles",favId("movie",id)):doc(db,"titles",favId("tv",id),"episodes",`s${se}e${ep}`)).catch(()=>null)
    ]);
    const link=own&&own.exists()?own.data():null,quals=link?normQuals(link):[];
    const name=(d.title||d.name||"")+(type==="tv"?` - S${se} E${ep}`:"");
    const bd=d.backdrop_path?IMG+"w1280"+d.backdrop_path:(d.poster_path?IMG+"w500"+d.poster_path:"");
    if(!quals.length){document.body.insertAdjacentHTML("beforeend",`<div class="center" style="position:fixed;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center">هذا المحتوى غير متوفر بعد</div>`);return}
    trackVisit({type,id,title:d.original_title||d.original_name||d.title||d.name,poster:d.poster_path?IMG+"w342"+d.poster_path:""});
    play({embed:true,title:name,quals,subtitle:link.subtitle,poster:bd,backdrop:bd,kind:type==="tv"?"episode":"movie",rep:{type,tmdbId:id,title:name,season:se||0,episode:ep||0}});
  }catch(e){document.body.insertAdjacentHTML("beforeend",`<div class="center" style="position:fixed;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center">تعذر تحميل الفيديو</div>`)}
}
{const em=location.hash.match(/^#\/embed\/(movie|tv)\/(\d+)(?:\/(\d+)\/(\d+))?/);
 if(em)runEmbed(em[1],+em[2],em[3]?+em[3]:0,em[3]?+em[4]:0);
 else{
  goTab("home");
  const m=location.hash.match(/^#\/(movie|tv)\/(\d+)(?:\/(\d+)\/(\d+))?/);
  if(m){openDetail(m[1],+m[2],m[3]?{s:+m[3],e:+m[4]}:null);
    const t0=Date.now(),iv=setInterval(()=>{if((window.JP&&JP.isOpen())||Date.now()-t0>8000){clearInterval(iv);document.documentElement.classList.remove("boot")}},100)}
  else document.documentElement.classList.remove("boot")
 }}
</script>
